# user/plugins/simple-shop-payment-test/blueprints.yaml
name: Simple Shop Payment Test
version: 1.0.0
description: Module complémentaire de test pour simuler les transactions de paiement sur Simple Shop.
icon: credit-card
author:
  name: Guillon Flavien
homepage: https://github.com/flavi1/grav-simple-shop-payment-test
keywords: grav, plugin, shop, payment, test
bugs: https://github.com/flavi1/grav-simple-shop-payment-test/issues
license: MIT

dependencies:
  - name: simple-shop

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Statut du module
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
